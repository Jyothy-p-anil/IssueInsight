
{% extends 'base.html' %}

{% block title %}Edit User | IssueInsight{% endblock %}

{% block content %}

<h2>Edit User</h2>

<p class="text-muted">
    Update account details for {{ account.username }}.
</p>

<div class="card shadow-sm mt-4">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'manage_users' %}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
