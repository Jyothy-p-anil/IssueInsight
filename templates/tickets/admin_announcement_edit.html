
{% extends 'base.html' %}

{% block title %}Edit Announcement | IssueInsight{% endblock %}

{% block content %}

<h2 class="mb-4">Edit Public Announcement</h2>

<div class="card">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Title</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                {{ form.content }}
                {{ form.content.errors }}
            </div>

            <div class="form-check mb-3">
                {{ form.is_published }}
                <label class="form-check-label">
                    Publish publicly
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'manage_announcements' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>


{% endblock %}
